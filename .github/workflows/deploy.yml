name: Deploy — Sententia.ai

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Backend → Hugging Face Spaces
  # Pushes the backend/ directory to the HF Spaces Git repo.
  # Requires secrets: HF_TOKEN, HF_SPACE_REPO (e.g. "YourOrg/sententia-backend")
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Hugging Face Spaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push backend to HF Spaces Git
        env:
          HF_TOKEN:      ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          git config --global user.email "ci@sententia.ai"
          git config --global user.name  "Sententia CI"

          # Clone HF Spaces repo into /tmp
          git clone https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO} /tmp/hf_space

          # Sync backend/ into it (excluding tests + local scripts)
          rsync -av --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='tests/' \
            --exclude='.env' \
            backend/ /tmp/hf_space/

          # Commit and push to HF Spaces (triggers rebuild)
          cd /tmp/hf_space
          git add -A
          git diff --cached --quiet || git commit -m "deploy: ${{ github.sha }}"
          git push

  # ──────────────────────────────────────────────────────────────────────────────
  # Frontend → Cloudflare Pages
  # Uses the official Cloudflare Pages GitHub Action.
  # Requires secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
  # Requires vars:    CF_PAGES_PROJECT_NAME (e.g. "sententia-frontend")
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Cloudflare Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build (next-on-pages)
        run: npx @cloudflare/next-on-pages@1
        env:
          NEXT_PUBLIC_API_URL:           ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken:      ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:     ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName:   ${{ vars.CF_PAGES_PROJECT_NAME }}
          directory:     frontend/.vercel/output/static
          gitHubToken:   ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────────
  # Smoke test — ping deployed backend health endpoint after deploy
  # ──────────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Post-Deploy Smoke Test
    needs: [deploy-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for HF Spaces to build (60s)
        run: sleep 60

      - name: Ping /health
        env:
          HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${HF_SPACE_URL}/health")
          echo "Health endpoint returned: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
