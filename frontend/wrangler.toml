name = "sententia-frontend"

# Required by Cloudflare Pages — tells it where the built output lives
pages_build_output_dir = ".vercel/output/static"

# nodejs_compat is REQUIRED for Next.js on Pages (node:buffer, node:async_hooks)
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2024-09-23"

[build]
command = "npm ci && npx @cloudflare/next-on-pages@1"

[build.environment]
NODE_VERSION = "22"
